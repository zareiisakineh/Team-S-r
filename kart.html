           KART
        ========================================= */

            font-size: 12px;

            line-height: 1.4;

           TEAMNAVN
        ========================================= */

        .teamlabel {

            font-weight: 700;

            font-size: 15px;

            text-shadow:

                1px 0 2px white,

        }


        /* =========================================
           HEADER
        ========================================= */

        .topbar {

            height: 65px;

            position: relative;

            z-index: 2000;

        }


        .nav {

            position: relative !important;

        }


        #menu {

            position: relative;

            z-index: 2002;

        }


        .menu-toggle {

            position: absolute !important;

            top: 50% !important;

            right: 15px !important;

        }


        /* =========================================
           KOMPASS
        ========================================= */

        .compass {

            width: 70px;

            height: 70px;

            background:
                rgba(255,255,255,0.95);

            border-radius: 50%;

            border: 2px solid #555;

            box-shadow:
                0 1px 6px rgba(0,0,0,.35);

            position: relative;

            font-family: Arial, sans-serif;

            font-weight: bold;

            text-align: center;

            z-index: 1000;

        }


        .compass .n {

            position: absolute;

            top: 4px;

            left: 0;

            right: 0;

            color: #d62f2f;

        }


        .compass .s {

            position: absolute;

            bottom: 4px;

            left: 0;

            right: 0;

        }


        .compass .e {

            position: absolute;

            right: 6px;

            top: 25px;

        }


        .compass .w {

            position: absolute;

            left: 6px;

            top: 25px;

        }


        .compass .arrow {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 4px;

            height: 25px;

            background: #d62f2f;

            transform:
                translate(-50%, -50%);

        }


        .compass .center {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 9px;

            height: 9px;

            background: #333;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

        }


        /* =========================================
           REDIGERINGSKNAPP
        ========================================= */

        .edit-control {

            background: white;

            padding: 8px;

            border-radius: 6px;

            box-shadow:
                0 1px 6px rgba(0,0,0,.35);

        }


        .edit-control button {

            border: 1px solid #999;

            background: white;

            padding: 8px 10px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;

        }


        .edit-control button:hover {

            background: #f1f1f1;

        }


        .edit-info {

            margin-top: 8px;

            font-size: 12px;

            line-height: 1.4;

            max-width: 240px;

        }


        /* =========================================
           PUNKT P1, P2, P3...
        ========================================= */

        .edit-marker {

            background: white;

            border: 2px solid #222;

            border-radius: 6px;

            width: 38px !important;

            height: 26px !important;

            line-height: 22px;

            text-align: center;

            font-weight: bold;

            font-size: 11px;

            box-sizing: border-box;

            box-shadow:
                0 1px 4px rgba(0,0,0,.45);

        }


        .edit-marker:hover {

            transform: scale(1.12);

        }


        /* =========================================
           KOORDINAT POPUP
        ========================================= */

        .coordinate-popup {

            font-size: 13px;

            line-height: 1.5;

            min-width: 180px;

        }


        .coordinate-popup hr {

            border: 0;

            border-top: 1px solid #ddd;

            margin: 7px 0;

        }


        .coordinate-popup button {

            margin-top: 7px;

            padding: 6px 9px;

            border: 1px solid #999;

            border-radius: 4px;

            background: white;

            cursor: pointer;

        }


        /* =========================================
           TEAM SØR PANEL
        ========================================= */

        .south-panel {

            background: white;

            width: 280px;

            max-height: 65vh;

            overflow-y: auto;

            padding: 12px;

            border-radius: 7px;

            box-shadow:
                0 2px 8px rgba(0,0,0,.35);

            font-size: 12px;

        }


        .south-panel h3 {

            margin: 0 0 5px;

            font-size: 15px;

        }


        .south-panel .panel-info {

            margin-bottom: 10px;

            color: #555;

            line-height: 1.4;

        }


        .point-row {

            display: flex;

            align-items: center;

            gap: 7px;

            padding: 5px 4px;

            border-bottom: 1px solid #eee;

            cursor: pointer;

        }


        .point-row:hover {

            background: #f2f2f2;

        }


        .point-number {

            flex: 0 0 38px;

            font-weight: bold;

        }


        .point-coordinate {

            font-family: monospace;

            font-size: 11px;

        }


        .copy-all-button {

            width: 100%;

            margin-top: 10px;

            padding: 8px;

            border: 1px solid #888;

            border-radius: 5px;

            background: white;

            cursor: pointer;

            font-weight: bold;

        }


        .copy-all-button:hover {

            background: #f1f1f1;

        }


        /* =========================================
           PANEL KNAPP
        ========================================= */

        .panel-toggle {

            margin-top: 6px;

            width: 100%;

            padding: 6px;

            border: 1px solid #aaa;

            border-radius: 5px;

            background: #fafafa;

            cursor: pointer;

        }


        /* =========================================
           MOBIL
        ========================================= */

        @media (max-width: 600px) {

            .south-panel {

                width: 245px;

            }


            .edit-control {

                padding: 6px;

            }


            .edit-control button {

                font-size: 12px;

                padding: 7px 8px;

            }

        }

    </style>

/* =====================================================
   TEGN TEAMOMRÅDER
===================================================== */

teams.forEach(team => {


    const polygon = L.polygon(

        team.pts,

        {

            color: team.color,

            weight: 3,

            opacity: 1,

            fillColor: team.fill,

            fillOpacity: 0.28,

            interactive: false

        }

    ).addTo(map);


    team._polygon = polygon;


    polygon.bindTooltip(

        team.name,

        {

            permanent: true,

            direction: 'center',

            className: 'teamlabel',

            opacity: 0.95

        }

    );


    polygon.bindPopup(

        `<b>${team.name}</b><br><br>
         Bruk "Rediger grenser" for å flytte punktene.`

    );

});



/* =====================================================
   INFORMASJONSBOKS
===================================================== */

const note = L.control({

    position: 'bottomleft'

});


note.onAdd = function() {


    const div = L.DomUtil.create(

        'div',

        'note'

    );


    div.innerHTML = `

        Kartgrunnlaget er hentet fra
        OpenStreetMap.

    `;


    return div;

};


note.addTo(map);



/* =====================================================
   REDIGERINGSPUNKTER
===================================================== */

let editMode = false;

const editMarkers = [];

let coordinateMarker = null;


/* =====================================================
   LAG REDIGERINGSPUNKTER
===================================================== */

teams.forEach((team) => {


    team.pts.forEach((point, pointIndex) => {


        const pointNumber =
            pointIndex + 1;


        const marker = L.marker(

            point,

            {

                draggable: true,

                autoPan: true,

                icon: L.divIcon({

                    className:
                        'edit-marker',

                    html:
                        `P${pointNumber}`,

                    iconSize:
                        [38, 26],

                    iconAnchor:
                        [19, 13]

                })

            }

        );


        marker.bindTooltip(

            `${team.name} – P${pointNumber}`,

            {

                direction: 'top'

            }

        );


        /* -----------------------------------------
           NÅR PUNKTET DRAS
        ----------------------------------------- */

        marker.on('drag', function(e) {


            const position =
                e.target.getLatLng();


            team.pts[pointIndex] = [

                position.lat,

                position.lng

            ];


            team._polygon.setLatLngs(

                team.pts

            );


            /* Oppdater Team Sør-panelet */

            updateSouthPanel();

        });


        /* -----------------------------------------
           NÅR PUNKTET SLIPPES
        ----------------------------------------- */

        marker.on('dragend', function(e) {


            const position =
                e.target.getLatLng();


            const lat =
                Number(
                    position.lat.toFixed(6)
                );


            const lng =
                Number(
                    position.lng.toFixed(6)
                );


            team.pts[pointIndex] = [

                lat,

                lng

            ];


            team._polygon.setLatLngs(

                team.pts

            );


            marker.bindPopup(`

                <div class="coordinate-popup">

                    <b>${team.name}</b>

                    <br>

                    <b>P${pointNumber}</b>

                    <hr>

                    Koordinat i koden:

                    <br>

                    <b>[${lat}, ${lng}]</b>

                    <br><br>

                    <button
                        onclick="
                            copyCoordinate(
                                ${lat},
                                ${lng}
                            )
                        ">

                        📋 Kopier

                    </button>

                </div>

            `).openPopup();


            console.log(

                `${team.name} P${pointNumber}: ` +

                `[${lat}, ${lng}]`

            );


            updateSouthPanel();

        });


        editMarkers.push({

            marker: marker,

            team: team,

            pointIndex: pointIndex

        });

    });

});


/*
/* =====================================================
   KOORDINAT-PANEL FOR TEAM SØR
===================================================== */

const southPanel =
    L.control({

        position: 'bottomright'

    });


southPanel.onAdd = function() {


    const div =
        L.DomUtil.create(

            'div',

            'south-panel'

        );


    div.id =
        'southCoordinatePanel';


    div.innerHTML = `

        <h3>
            🟠 TEAM SØR
        </h3>

        <div class="panel-info">

            Punktene nedenfor tilsvarer
            nøyaktig P1, P2, P3 osv.
            i <b>pts</b>-listen.

        </div>

        <div id="southPointList">

        </div>


        <button
            class="copy-all-button"
            id="copySouthCoordinates">

            📋 Kopier hele Team Sør-listen

        </button>


        <button
            class="panel-toggle"
            id="closeSouthPanel">

            Skjul panel

        </button>

    `;


    L.DomEvent.disableClickPropagation(div);


    return div;

};


southPanel.addTo(map);



/* =====================================================
   OPPDATER TEAM SØR-PANEL
===================================================== */

function updateSouthPanel() {


    const southTeam =
        teams.find(

            team =>
                team.name === 'TEAM SØR'

        );


    if (!southTeam) {

        return;

    }


    const list =
        document.getElementById(
            'southPointList'
        );


    if (!list) {

        return;

    }


    list.innerHTML = '';


    southTeam.pts.forEach(

        (point, index) => {


            const lat =
                Number(
                    point[0].toFixed(6)
                );


            const lng =
                Number(
                    point[1].toFixed(6)
                );


            const row =
                document.createElement(
                    'div'
                );


            row.className =
                'point-row';


            row.innerHTML = `

                <div class="point-number">

                    P${index + 1}

                </div>

                <div class="point-coordinate">

                    [${lat}, ${lng}]

                </div>

            `;


            /* Klikk på punktet i panelet */

            row.addEventListener(

                'click',

                function() {


                    const item =
                        editMarkers.find(

                            item =>
                                item.team ===
                                southTeam &&

                                item.pointIndex ===
                                index

                        );


                    if (!item) {

                        return;

                    }


                    map.setView(

                        item.marker.getLatLng(),

                        Math.max(
                            map.getZoom(),
                            17
                        )

                    );


                    item.marker.openPopup();


                }

            );


            list.appendChild(row);

        }

    );

}


updateSouthPanel();



/* =====================================================
   KOPIER HELE TEAM SØR-LISTEN
===================================================== */

function copySouthCoordinates() {


    const southTeam =
        teams.find(

            team =>
                team.name === 'TEAM SØR'

        );


    if (!southTeam) {

        return;

    }


    let text =
        'pts: [\n';


    southTeam.pts.forEach(

        (point, index) => {


            const lat =
                Number(
                    point[0].toFixed(6)
                );


            const lng =
                Number(
                    point[1].toFixed(6)
                );


            text +=

                `    /* P${index + 1} */\n` +

                `    [${lat}, ${lng}]`;


            if (
                index <
                southTeam.pts.length - 1
            ) {

                text += ',';

            }


            text += '\n';

        }

    );


    text += ']';


    navigator.clipboard
        .writeText(text)

        .then(() => {


            alert(
                'Hele Team Sør-listen er kopiert.'
            );


            console.log(text);

        })

        .catch(() => {


            console.log(text);


            alert(
                'Listen kunne ikke kopieres automatisk. ' +
                'Se konsollen (F12).'
            );

        });

}


document
    .getElementById(
        'copySouthCoordinates'
    )
    .addEventListener(

        'click',

        copySouthCoordinates

    );



/* =====================================================
   SKJUL TEAM SØR-PANEL
===================================================== */

document
    .getElementById(
        'closeSouthPanel'
    )
    .addEventListener(

        'click',

        function() {


            const panel =
                document.getElementById(
                    'southCoordinatePanel'
                );


            if (
                panel.style.display ===
                'none'
            ) {


                panel.style.display =
                    'block';


                this.textContent =
                    'Skjul panel';


            }

            else {


                panel.style.display =
                    'none';


                this.textContent =
                    'Vis Team Sør-punkter';

            }

        }

    );



/* =====================================================
   KOPIER ETT KOORDINAT
===================================================== */

function copyCoordinate(
    lat,
    lng
) {


    const text =
        `[${lat}, ${lng}]`;


    navigator.clipboard
        .writeText(text)

        .then(() => {


            alert(
                `Koordinater kopiert:\n${text}`
            );

        })

        .catch(() => {


            alert(text);

        });

}


window.copyCoordinate =
    copyCoordinate;

                til riktig sted.

                <br><br>

                Team Sør-listen viser
                samtidig hvilket punkt
                du redigerer.

            </div>

        `;


        L.DomEvent.disableClickPropagation(
            div
        );


        return div;

    };


editControl.addTo(map);



/* =====================================================
   REDIGERING PÅ / AV
===================================================== */

document
    .getElementById(
        'editMapButton'
    )
    .addEventListener(

        'click',

        function() {


            editMode =
                !editMode;


            editMarkers.forEach(

                item => {


                    if (editMode) {


                        item.marker.addTo(
                            map
                        );


                    }

                    else {


                        map.removeLayer(
                            item.marker
                        );

                    }

                }

            );


            const info =
                document.getElementById(
                    'editInfo'
                );


            if (editMode) {


                this.textContent =
                    '❌ Avslutt redigering';


                info.style.display =
                    'block';


            }

            else {


                this.textContent =
                    '✏️ Rediger grenser';


                info.style.display =
                    'none';

            }

        }

    );



/* =====================================================
   KLIKK PÅ KARTET FOR Å FINNE KOORDINATER
===================================================== */

map.on('click', function(e) {


    if (editMode) {

        return;

    }


    const lat =
        e.latlng.lat.toFixed(6);


    const lng =
        e.latlng.lng.toFixed(6);


    console.log(

        `Latitude: ${lat}, Longitude: ${lng}`

    );


    if (coordinateMarker) {

        map.removeLayer(
            coordinateMarker
        );

    }


    coordinateMarker =
        L.marker(e.latlng)

            .addTo(map)

            .bindPopup(`

                <div class="coordinate-popup">

                    <b>Koordinater</b>

                    <br><br>

                    Latitude:

                    <br>

                    ${lat}

                    <br><br>

                    Longitude:

                    <br>

                    ${lng}

                    <br><br>

                    <button
                        onclick="
                            copyCoordinate(
                                ${lat},
                                ${lng}
                            )
                        ">

                        📋 Kopier

                    </button>

                </div>

            `)

            .openPopup();

});



/* =====================================================
   TILPASS KARTET
===================================================== */

const allPoints = [];


teams.forEach(

    team => {


        team.pts.forEach(

            point => {


                allPoints.push(point);

            }

        );

    }

);


map.fitBounds(

    L.latLngBounds(allPoints),

    {

        padding: [30, 30]

    }

);


</script>
