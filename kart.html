    <style>

        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }


        /* -----------------------------------------
           KART
        ----------------------------------------- */

        #map {
            width: 100%;
            height: calc(100vh - 65px);
        }


        /* -----------------------------------------
           LEGEND
        ----------------------------------------- */

        .legend {
            background: white;
            padding: 10px 12px;
            border-radius: 6px;

            box-shadow:
                0 1px 5px rgba(0,0,0,.35);

            line-height: 1.45;
        }

        .legend h3 {
            margin: 0 0 7px;
            font-size: 15px;
        }

        .sw {
            display: inline-block;
            width: 14px;
            height: 14px;

            margin-right: 7px;

            vertical-align: -2px;

            border: 2px solid rgba(0,0,0,.35);
        }


        /* -----------------------------------------
           INFORMASJONSBOKS
        ----------------------------------------- */

        .note {
            background: white;

            padding: 8px 10px;

            border-radius: 5px;

            box-shadow:
                0 1px 5px rgba(0,0,0,.25);

            max-width: 320px;

            font-size: 12px;

            line-height: 1.4;
        }


        /* -----------------------------------------
           TEAM NAVN
        ----------------------------------------- */

        .teamlabel {

            font-weight: 700;

            font-size: 15px;

            text-shadow:
                0 1px 2px white,
                0 -1px 2px white,
                1px 0 2px white,
                -1px 0 2px white;

        }


        /* -----------------------------------------
           HEADER
        ----------------------------------------- */

            .topbar {
            height: 65px;
            position: relative;
            z-index: 2000;
        }

       .nav {
      position: relative !important;
       }

        #menu {
            position: relative;
            z-index: 2002;
        }

        .menu-toggle {
           position: absolute !important;
            top: 50% !important;
            right: 15px !important;
        }

        /* Kompass */
            .compass {
                width: 70px;
                height: 70px;
                background: rgba(255,255,255,0.95);
                border-radius: 50%;
                border: 2px solid #555;
                box-shadow: 0 1px 6px rgba(0,0,0,.35);
                position: relative;
                font-family: Arial, sans-serif;
                font-weight: bold;
                text-align: center;
                z-index: 1000;
            }

            .compass .n {
                position: absolute;
                top: 4px;
                left: 0;
                right: 0;
                color: #d62f2f;
            }

            .compass .s {
                position: absolute;
                bottom: 4px;
                left: 0;
                right: 0;
            }

            .compass .e {
                position: absolute;
                right: 6px;
                top: 25px;
            }

            .compass .w {
                position: absolute;
                left: 6px;
                top: 25px;
            }

            .compass .arrow {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 4px;
                height: 25px;
                background: #d62f2f;
                transform: translate(-50%, -50%);
            }

            .compass .center {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 9px;
                height: 9px;
                background: #333;
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }

    </style>

</head>

<!-- =========================================
     KART
========================================= -->

<div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
   KART
===================================================== */

const map = L.map('map', {

    zoomControl: true

}).setView(

    [59.914, 10.785],

    14

);



/* =====================================================
   OPENSTREETMAP
===================================================== */

L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

        maxZoom: 19,

        attribution:
            '© OpenStreetMap contributors'

    }

).addTo(map);


// =====================================================
// KOMPASS
// =====================================================

const compass = L.control({
    position: 'topright'
});

compass.onAdd = function() {

    const div = L.DomUtil.create('div', 'compass');

    div.innerHTML = `
        <div class="n">N</div>
        <div class="e">Ø</div>
        <div class="s">S</div>
        <div class="w">V</div>

        <div class="arrow"></div>
        <div class="center"></div>
    `;

    // Hindrer at klikk på kompasset påvirker kartet
    L.DomEvent.disableClickPropagation(div);

    return div;
};

compass.addTo(map);

/* =====================================================
   TEAMOMRÅDER
=====================================================

   VIKTIG:

   Oslo kommune publiserer områdene som tekst,
   men ikke GIS-polygoner for hjemmesykepleieteamene.

   Polygonene nedenfor er derfor en geografisk
   visualisering av områdene, ikke et offisielt
   GIS-lag fra Oslo kommune.

   Offisiell inndeling:

   TEAM VEST:
   - Tøyen
   - Kjølberggata
   - Ringgata
   - Hagegata
   - Kolstadgata
   - Kampen

   TEAM ØST:
   - Ekeberg
   - Kværnerbyen
   - Galgeberg
   - Jordal Terrasse
   - Schweigaards gate
   - Etterstadsletta 1–46

   TEAM NORD:
   - Ensjø
   - Valle
   - Etterstad

   TEAM SØR:
   - Grønland
   - Tøyen
   - Sørenga

===================================================== */


const teams = [


    /* =================================================
       TEAM VEST
    ================================================= */

    {

        name: 'TEAM VEST',

        color: '#2e8b57',

        fill: '#8fd18f',

        pts: [

            [59.9305, 10.7540],

            [59.9330, 10.7620],

            [59.9300, 10.7720],

            [59.9240, 10.7790],

            [59.9200, 10.7830],

            [59.9160, 10.7780],

            [59.9140, 10.7680],

            [59.9180, 10.7580],

            [59.9230, 10.7500],

            [59.9280, 10.7480]

        ]

    },


    /* =================================================
       TEAM NORD
    ================================================= */

    {

        name: 'TEAM NORD',

        color: '#1769d1',

        fill: '#7fb3ff',

        pts: [

            [59.9300, 10.7720],

            [59.9370, 10.7800],

            [59.9440, 10.7980],

            [59.9430, 10.8140],

            [59.9360, 10.8260],

            [59.9230, 10.8320],

            [59.9140, 10.8250],

            [59.9140, 10.8070],

            [59.9200, 10.7900],

            [59.9240, 10.7790]

        ]

    },


    /* =================================================
       TEAM SØR
    ================================================= */

    {

        name: 'TEAM SØR',

        color: '#e88a00',

        fill: '#ffd083',

        pts: [

            [59.914900, 10.759220],

            [59.9140, 10.7690],
            

            [59.909, 10.7780],
            

            [59.9050, 10.780],
            

            [59.8990, 10.7750],
            

             [59.905123, 10.779991],

                       [59.89999, 10.769863],

            [59.8990, 10.7560],

        [59.902799, 10.751839],

            [59.9110, 10.7498],
            


            [59.9150, 10.7590],

            

        ]

    },


    /* =================================================
       TEAM ØST
    ================================================= */

    {

        name: 'TEAM ØST',

        color: '#d62f2f',

        fill: '#ff9b9b',

        pts: [

            [59.9140, 10.8070],

            [59.9140, 10.8250],

            [59.9050, 10.8290],

            [59.8970, 10.8250],

            [59.8900, 10.8120],

            [59.8880, 10.7990],

            [59.8960, 10.7880],

            [59.9020, 10.7840],

            [59.9080, 10.7780],

            [59.9140, 10.7900]

        ]

    }

];



/* =====================================================
   TEGN TEAMOMRÅDENE
===================================================== */

teams.forEach(team => {


    const polygon = L.polygon(

        team.pts,

        {

            color: team.color,

            weight: 3,

            opacity: 1,

            fillColor: team.fill,

            fillOpacity: 0.28,

             interactive: false

        }

    ).addTo(map);



    /* -----------------------------------------
       TEAMNAVN
    ----------------------------------------- */

    polygon.bindTooltip(

        team.name,

        {

            permanent: true,

            direction: 'center',

            className: 'teamlabel',

            opacity: 0.95

        }

    );


    /* -----------------------------------------
       POPUP
    ----------------------------------------- */

    polygon.bindPopup(

        `<b>${team.name}</b><br><br>
         Klikk på kartet for å se gatenavn.
         `

    );

});



/* =====================================================
   LEGENDE
===================================================== */

const legend = L.control({

    position: 'topright'

});

/*
legend.onAdd = function() {


    const div = L.DomUtil.create(

        'div',

        'legend'

    );


    div.innerHTML = `

        <h3>Hjemmesykepleie</h3>

        <div>
            <span
                class="sw"
                style="
                    background:#ffd083;
                    border-color:#e88a00;
                ">
            </span>

            Team Sør
        </div>

        <div>
            <span
                class="sw"
                style="
                    background:#8fd18f;
                    border-color:#2e8b57;
                ">
            </span>

            Team Vest
        </div>

        <div>
            <span
                class="sw"
                style="
                    background:#7fb3ff;
                    border-color:#1769d1;
                ">
            </span>

            Team Nord
        </div>

        <div>
            <span
                class="sw"
                style="
                    background:#ff9b9b;
                    border-color:#d62f2f;
                ">
            </span>

            Team Øst
        </div>

    `;


    return div;

};


legend.addTo(map);

*/

/* =====================================================
   INFORMASJONSBOKS
===================================================== */

const note = L.control({

    position: 'bottomleft'

});


note.onAdd = function() {


    const div = L.DomUtil.create(

        'div',

        'note'

    );


    div.innerHTML = `

        Kartgrunnlaget er hentet fra
        OpenStreetMap.

    `;


    return div;

};


note.addTo(map);



/* =====================================================
   TILPASS KARTET TIL ALLE TEAMENE
===================================================== */

const allPoints = [];


teams.forEach(team => {

    team.pts.forEach(point => {

        allPoints.push(point);

    });

});


map.fitBounds(

    L.latLngBounds(allPoints),

    {

        padding: [30, 30]

    }

);
map.on('click', function(e) {
    console.log(
        e.latlng.lat.toFixed(6),
        e.latlng.lng.toFixed(6)
    );

    L.marker(e.latlng)
        .addTo(map)
        .bindPopup(
            e.latlng.lat.toFixed(6) +
            ', ' +
            e.latlng.lng.toFixed(6)
        )
        .openPopup();
});


</script>
