           KOMPASS
        ========================================= */

        .compass {

            width: 70px;

            height: 70px;

                rgba(255,255,255,0.95);

            border-radius: 50%;

            border: 2px solid #555;

            box-shadow:
                0 1px 6px rgba(0,0,0,.35);

            position: relative;

            font-family: Arial, sans-serif;

            font-weight: bold;

            text-align: center;

            z-index: 1000;

        }


        .compass .n {

            position: absolute;

            top: 4px;

            left: 0;

            right: 0;

            color: #d62f2f;

        }


        .compass .s {

            position: absolute;

            bottom: 4px;

            left: 0;

            right: 0;

        }


        .compass .e {

            position: absolute;

            right: 6px;

            top: 25px;

        }


        .compass .w {

            position: absolute;

            left: 6px;

            top: 25px;

        }


        .compass .arrow {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 4px;

            height: 25px;

            background: #d62f2f;

            transform:
                translate(-50%, -50%);

        }


        .compass .center {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 9px;

            height: 9px;

            background: #333;

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

        }

           FARGELEGEND
        ========================================= */

            background: white;

            padding: 12px 14px;

            border-radius: 7px;

            min-width: 180px;

            font-size: 13px;

            line-height: 1.5;

        }


        .team-legend h3 {

            margin: 0 0 10px;

            font-size: 15px;

        }


        .legend-row {

            display: flex;

            align-items: center;

            margin: 6px 0;

        }


        .legend-color {

            width: 22px;

            height: 18px;

            margin-right: 9px;

            border: 2px solid rgba(0,0,0,.35);

            border-radius: 3px;

            box-sizing: border-box;

        }


        /* =========================================
           REDIGERINGSPANEL
        ========================================= */

        .edit-control {

            background: white;

            padding: 8px;

            border-radius: 6px;

            box-shadow:
                0 1px 6px rgba(0,0,0,.35);

        }


        .edit-control button {

            border: 1px solid #999;

            background: white;

            padding: 8px 10px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;

        }


        .edit-control button:hover {

            background: #f1f1f1;

        }


        .edit-info {

            margin-top: 8px;

            font-size: 12px;

            line-height: 1.4;

            max-width: 240px;

        }


        /* =========================================
           PUNKT P1, P2, P3...
        ========================================= */

        .edit-marker {

            background: white;

            border: 2px solid #222;

            border-radius: 6px;

            width: 38px !important;

            height: 26px !important;

            line-height: 22px;

            text-align: center;

            font-weight: bold;

            font-size: 11px;

            box-sizing: border-box;

            box-shadow:
                0 1px 4px rgba(0,0,0,.45);

        }


        .edit-marker:hover {

            transform: scale(1.12);

        }


        /* =========================================
           KOORDINAT POPUP
        ========================================= */

        .coordinate-popup {

            font-size: 13px;

            line-height: 1.5;

            min-width: 180px;

        }

            border: 0;

            border-top: 1px solid #ddd;

            padding: 6px 9px;

            border-radius: 4px;

            background: white;

            .edit-control {

                padding: 6px;

            }


            .edit-control button {

                font-size: 12px;

                padding: 7px 8px;

            }

let editMode = false;

const editMarkers = [];

let coordinateMarker = null;



/* =====================================================
   LAG REDIGERINGSPUNKTER
===================================================== */

teams.forEach((team) => {


    team.pts.forEach((point, pointIndex) => {


        const pointNumber =
            pointIndex + 1;


        const marker = L.marker(

            point,

            {

                draggable: true,

                autoPan: true,

                icon: L.divIcon({

                    className:
                        'edit-marker',

                    html:
                        `P${pointNumber}`,

                    iconSize:
                        [38, 26],

                    iconAnchor:
                        [19, 13]

                })

            }

        );


        marker.bindTooltip(

            `${team.name} – P${pointNumber}`,

            {

                direction: 'top'

            }

        );



        /* =========================================
           NÅR PUNKTET DRAS
        ========================================= */

        marker.on('drag', function(e) {


            const position =
                e.target.getLatLng();


            team.pts[pointIndex] = [

                position.lat,

                position.lng

            ];


            team._polygon.setLatLngs(

                team.pts

            );

        });



        /* =========================================
           NÅR PUNKTET SLIPPES
        ========================================= */

        marker.on('dragend', function(e) {


            const position =
                e.target.getLatLng();


            const lat =
                Number(
                    position.lat.toFixed(6)
                );


            const lng =
                Number(
                    position.lng.toFixed(6)
                );


            team.pts[pointIndex] = [

                lat,

                lng

            ];


            team._polygon.setLatLngs(

                team.pts

            );


            marker.bindPopup(`

                <div class="coordinate-popup">

                    <b>${team.name}</b>

                    <br>

                    <b>P${pointNumber}</b>

                    <hr>

                    Koordinat i koden:

                    <br>

                    <b>[${lat}, ${lng}]</b>

                    <br><br>

                    <button
                        onclick="
                            copyCoordinate(
                                ${lat},
                                ${lng}
                            )
                        ">

                        📋 Kopier

                    </button>

                </div>

            `).openPopup();


            console.log(

                `${team.name} P${pointNumber}: ` +

                `[${lat}, ${lng}]`

            );

        });



        editMarkers.push({

            marker: marker,

            team: team,

            pointIndex: pointIndex

        });

    });

});



/* =====================================================
   KOPIER ETT KOORDINAT
===================================================== */

function copyCoordinate(

    lat,

    lng

) {


    const text =
        `[${lat}, ${lng}]`;


    navigator.clipboard

        .writeText(text)

        .then(() => {


            alert(

                `Koordinater kopiert:\n${text}`

            );

        })

        .catch(() => {


            alert(text);

        });

}


window.copyCoordinate =
    copyCoordinate;

/* =====================================================
   REDIGERING PÅ / AV
===================================================== */

document

    .getElementById(
        'editMapButton'
    )

    .addEventListener(

        'click',

        function() {


            editMode =
                !editMode;


            editMarkers.forEach(

                item => {


                    if (editMode) {


                        item.marker.addTo(

                            map

                        );


                    }

                    else {


                        map.removeLayer(

                            item.marker

                        );

                    }

                }

            );


            const info =
                document.getElementById(

                    'editInfo'

                );


            if (editMode) {


                this.textContent =
                    '❌ Avslutt redigering';


                info.style.display =
                    'block';


            }

            else {


                this.textContent =
                    '✏️ Rediger grenser';


                info.style.display =
                    'none';

            }

        }

    );



/* =====================================================

===================================================== */

map.on('click', function(e) {


    if (editMode) {

        return;

    }


    const lat =
        e.latlng.lat.toFixed(6);


    const lng =
        e.latlng.lng.toFixed(6);


    console.log(

        `Latitude: ${lat}, Longitude: ${lng}`

    );


    if (coordinateMarker) {


        map.removeLayer(

            coordinateMarker

        );

    }


    coordinateMarker =

        L.marker(e.latlng)

            .addTo(map)

            .bindPopup(`

                <div class="coordinate-popup">

                    <b>Koordinater</b>

                    <br><br>

                    Latitude:

                    <br>

                    ${lat}

                    <br><br>

                    Longitude:

                    <br>

                    ${lng}

                    <br><br>

                    <button
                        onclick="
                            copyCoordinate(
                                ${lat},
                                ${lng}
                            )
                        ">

                        📋 Kopier

                    </button>

                </div>

            `)

            .openPopup();

});

teams.forEach(

    team => {


        team.pts.forEach(

            point => {


                allPoints.push(point);

            }

        );

    }

);


map.fitBounds(

    L.latLngBounds(allPoints),

    {

        padding: [30, 30]

    }

);
