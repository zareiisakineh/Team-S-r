/* =====================================================
   POINT-IN-POLYGON
===================================================== */

/*
   Undersøker om et koordinat ligger inne i
   et polygon.

   point = [latitude, longitude]

   polygon = [
       [latitude, longitude],
       ...
   ]
*/

function pointInPolygon(point, polygon) {

    const lat =
        point[0];

    const lng =
        point[1];


    let inside = false;


    for (
        let i = 0,
        j = polygon.length - 1;

        i < polygon.length;

        j = i++
    ) {

        const latI =
            polygon[i][0];

        const lngI =
            polygon[i][1];


        const latJ =
            polygon[j][0];

        const lngJ =
            polygon[j][1];


        const intersects =

            (
                (latI > lat) !==
                (latJ > lat)
            )

            &&

            (
                lng <
                (
                    (lngJ - lngI)
                    *
                    (lat - latI)
                    /
                    (latJ - latI)
                    +
                    lngI
                )
            );


        if (intersects) {

            inside = !inside;

        }

    }


    return inside;

}

    const matchingTeams =
        [];


    teams.forEach(team => {

        if (
            pointInPolygon(
                point,
                team.pts
            )
        ) {

            matchingTeams.push(team);

        }

    });


    return matchingTeams;

}

function showSearchResult(
    html,
    type
) {

    const result =
        document.getElementById(

    result.innerHTML =
        html;


    result.className =

/* =====================================================
   SØK ADRESSE
===================================================== */

async function searchAddress() {

    const input = document.getElementById(
            'addressSearch'
        );


    const query = input.value.trim();


    if (!query) {

        showSearchResult('Skriv inn en adresse først.', 'warning');

        return;

    }


    const button = document.getElementById('searchAddressButton');

    button.disabled = true;

    button.textContent =
        'Søker...';


    try {

        const url =
            'https://nominatim.openstreetmap.org/search?' +

            new URLSearchParams({

                q:
                    query + ', Oslo, Norge',

                format:
                    'jsonv2',

                addressdetails:
                    '1',

                limit:
                    '1',

                countrycodes:
                    'no'

            });


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                'Kunne ikke kontakte adressesøket.'
            );

        }


        const results =
            await response.json();


        if (
            !results ||
            results.length === 0
        ) {

            showSearchResult(

                `
                <b>Fant ikke adressen.</b>
                <br><br>
                Prøv for eksempel:
                <br>
                <b>Schweigaards gate 50</b>
                `,

                'error'

            );

            return;

        }


        const result =
            results[0];


        const lat =
            Number(result.lat);


        const lng =
            Number(result.lon);


        const matchingTeams =
            findTeamsForCoordinate(
                lat,
                lng
            );


        /* -----------------------------------------
           FJERN GAMMEL ADRESSEMARKØR
        ----------------------------------------- */

        if (addressMarker) {

            map.removeLayer(
                addressMarker
            );

        }


        /* -----------------------------------------
           LAG NY ADRESSEMARKØR
        ----------------------------------------- */

        addressMarker =
            L.marker(

                [lat, lng]

            ).addTo(map);


        addressMarker.bindPopup(`

            <div class="coordinate-popup">

                <b>📍 Adresse</b>

                <br><br>

                ${result.display_name}

                <hr>

                Latitude:
                ${lat.toFixed(6)}

                <br>

                Longitude:
                ${lng.toFixed(6)}

            </div>

        `);


        addressMarker.openPopup();


        /* -----------------------------------------
           ZOOM TIL ADRESSEN
        ----------------------------------------- */

        map.setView(

            [lat, lng],

            17

        );


        /* -----------------------------------------
           TEAM FUNNET
        ----------------------------------------- */

        if (
            matchingTeams.length === 1
        ) {

            const team =
                matchingTeams[0];


            showSearchResult(

                `

                <b>📍 Adresse</b>

                <br>

                ${result.display_name}

                <div class="team-answer"
                     style="color:${team.color};">

                    ${team.name}

                </div>

                <br>

                Adressen ligger innenfor
                dette teamområdet.

                `,

                'success'

            );

        }


        /* -----------------------------------------
           FLERE TEAM
        ----------------------------------------- */

        else if (
            matchingTeams.length > 1
        ) {

            const teamNames =
                matchingTeams
                    .map(team => {

                        return `

                            <span
                                style="
                                    color:${team.color};
                                    font-weight:bold;
                                ">

                                ${team.name}

                            </span>

                        `;

                    })
                    .join('<br>');


            showSearchResult(

                `

                <b>⚠️ Adressen ligger i et
                overlappende område.</b>

                <br><br>

                ${teamNames}

                <br><br>

                Grensene for disse områdene
                overlapper hverandre.
                Finjuster polygonene med
                «Rediger grenser».

                `,

                'warning'

            );

        }


        /* -----------------------------------------
           INGEN TEAM
        ----------------------------------------- */

        else {

            showSearchResult(

                `

                <b>⚠️ Adressen ligger utenfor
                de definerte teamområdene.</b>

                <br><br>

                Adresse:

                <br>

                ${result.display_name}

                <br><br>

                Kontroller grensene ved å
                bruke «Rediger grenser».

                `,

                'warning'

            );

        }

    }

    catch (error) {

        console.error(
            'Feil ved adressesøk:',
            error
        );


        showSearchResult(

            `

            <b>❌ Det oppstod en feil.</b>

            <br><br>

            Kunne ikke gjennomføre
            adressesøket akkurat nå.

            `,

            'error'

        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            'Finn';

    }

}

   REDIGERING
===================================================== */

let editMode =
    false;


const editMarkers =
    [];



/* =====================================================
   OPPRETT REDIGERINGSPUNKTER
===================================================== */

teams.forEach(team => {


    team.pts.forEach(

        (point, pointIndex) => {


            const pointNumber =
                pointIndex + 1;


            const marker =
                L.marker(

                    point,

                    {

                        draggable:
                            true,

                        autoPan:
                            true,

                        icon:
                            L.divIcon({

                                className:
                                    'edit-marker',

                                html:
                                    `P${pointNumber}`,

                                iconSize:
                                    [38, 26],

                                iconAnchor:
                                    [19, 13]

                            })

                    }

                );


            marker.bindTooltip(

                `${team.name} – P${pointNumber}`,

                {

                    direction:
                        'top'

                }

            );


            /* -----------------------------------------
               DRAG
            ----------------------------------------- */

            marker.on(

                'drag',

                function(e) {

                    const position =
                        e.target.getLatLng();


                    team.pts[pointIndex] = [

                        position.lat,

                        position.lng

                    ];


                    if (
                        team._polygon
                    ) {

                        team._polygon
                            .setLatLngs(
                                team.pts
                            );

                    }

                }

            );


            /* -----------------------------------------
               DRAGEND
            ----------------------------------------- */

            marker.on(

                'dragend',

                function(e) {

                    const position =
                        e.target.getLatLng();


                    const lat = Number(position.lat.toFixed(6));


                    const lng =
                        Number(
                            position.lng
                                .toFixed(6)
                        );


                    team.pts[pointIndex] = [

                        lat,

                        lng

                    ];


                    if (
                        team._polygon
                    ) {

                        team._polygon
                            .setLatLngs(
                                team.pts
                            );

                    }


                    marker.bindPopup(`

                        <div
                            class="coordinate-popup">

                            <b>
                                ${team.name}
                            </b>

                            <br>

                            <b>
                                P${pointNumber}
                            </b>

                            <hr>

                            Koordinat:

                            <br>

                            <b>
                                [${lat}, ${lng}]
                            </b>

                            <br>

                            <button
                                onclick="
                                    copyCoordinate(
                                        ${lat},
                                        ${lng}
                                    )
                                ">

                                📋 Kopier

                            </button>

                        </div>

                    `).openPopup();


                    console.log(

                        `${team.name} P${pointNumber}: ` +

                        `[${lat}, ${lng}]`

                    );

                }

            );


            editMarkers.push({

                marker:
                    marker,

                team:
                    team,

                pointIndex:
                    pointIndex

            });

        }

    );

});



/* =====================================================
   KOPIER ETT KOORDINAT
===================================================== */

function copyCoordinate(
    lat,
    lng
) {

    const text =
        `[${lat}, ${lng}]`;


    navigator.clipboard
        .writeText(text)

        .then(() => {

            alert(
                `Koordinater kopiert:\n${text}`
            );

        })

        .catch(() => {

            alert(text);

        });

}


window.copyCoordinate =
    copyCoordinate;

/* =====================================================

===================================================== */

function loadSavedCoordinates() {

    const saved = localStorage.getItem('teamOmraderCoordinates');

    if (!saved) {

        return false;

    }


    try {

        const savedTeams = JSON.parse(saved);

        savedTeams.forEach(savedTeam => {

            const team =
                teams.find(

                    t =>
                        t.name ===
                        savedTeam.name

                );


            if (
                team &&
                Array.isArray(savedTeam.pts)
            ) {

                team.pts =
                    savedTeam.pts;

            }

        });


        return true;

    }

    catch (error) {

        console.error(
            'Kunne ikke laste lagrede koordinater:',
            error
        );


        return false;

    }

}

/* =====================================================

function copyAllTeamCoordinates() {

    let text =
        'const teams = [\n\n';


    teams.forEach(

        (team, teamIndex) => {

            text +=
                `    {\n`;

            text +=
                `        name: '${team.name}',\n`;

            text +=
                `        color: '${team.color}',\n`;

            text +=
                `        fill: '${team.fill}',\n`;

            text +=
                `        pts: [\n`;


            team.pts.forEach(

                (point, index) => {

                    const lat =
                        Number(
                            point[0]
                                .toFixed(6)
                        );


                    const lng =
                        Number(
                            point[1]
                                .toFixed(6)
                        );


                    text +=

                        `            /* P${index + 1} */\n` +

                        `            [${lat}, ${lng}]`;


                    if (
                        index <
                        team.pts.length - 1
                    ) {

                        text += ',';

                    }


                    text += '\n';

                }

            );


            text +=
                `        ]\n`;

            text +=
                `    }`;


            if (
                teamIndex <
                teams.length - 1
            ) {

                text += ',';

            }


            text +=
                '\n\n';

        }

    );


    text +=
        '];';


    navigator.clipboard
        .writeText(text)

        .then(() => {

            alert(
                'Alle teamkoordinater er kopiert.'
            );


            console.log(text);

        })

        .catch(() => {

            console.log(text);


            alert(
                'Kunne ikke kopiere automatisk. ' +
                'Koordinatene ligger i konsollen (F12).'
            );

        });

}
