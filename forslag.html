<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="gerica.css">
</head>
<body>
    <h2>Forslag til Team Sør-nettsiden</h2>

<form id="forslagForm">

    <input type="text" id="navn" placeholder="Navn (valgfritt)">

    <select id="kategori">

        <option>
            Forbedring av nettsiden
        </option>

        <option>
            Fagstoff
        </option>

        <option>
            Rutiner
        </option>

        <option>
            Informasjon
        </option>

        <option>
            Annet
        </option>

    </select>

    <textarea id="forslag" rows="6" placeholder="Skriv ditt forslag her..." required></textarea>

    <button type="submit">
        Send forslag
    </button>

</form>

<p id="melding"></p>
</body>
</html>
