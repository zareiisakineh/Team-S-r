<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gerica.css">
    <title>Vaktbok</title>
    <style>
        .vaktKort{

            background:white;
            border-radius:12px;

            padding:15px;

            margin-bottom:10px;

            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        #vaktForm{

            display:flex;
            flex-direction:column;

            gap:10px;
        }

        #vaktForm input,
        #vaktForm textarea{

            padding:10px;

            border-radius:8px;

            border:1px solid #ccc;
        }

        #vaktForm button{

            background:#2f5d9f;
            color:white;

            border:none;

            padding:12px;

            border-radius:10px;
        }
    </style>

</head>
<body>
    <header class="topbar">
     <!--logo-->
        <div class="brand">
        <img src="images/logo-192.png" alt="Team Sør">
        </div>

        <nav class="nav" aria-label="Hovedmeny">
        <button class="menu-toggle" aria-label="Åpne meny" id="menuToggle" aria-expanded="false">☰</button>
             <ul id="menu"> 
              <li><a href="index.html" aria-current="page"> Hjem</a></li>
              <li><a href="ekstravakter.html" > Vaktbok</a></li>
              <li><a href="arbeidsliste.html">Merkantil</a></li>
              <li><a href="sjekkliste.html">Ansvarsykepleier </a></li>
              <li><a href="velferdsTeknologi.html">Velferdsteknologi</a></li>
              <li><a href="rutiner.html" >Rutiner</a></li>
              <li><a href="Bursdager.html">Bursdager</a></li>
              <li><a href="album.html">Sør-album </a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content" class="container">
        <section class="card">

            <h2>📅 Vaktbank</h2>

            <form id="vaktForm">

                <input
                type="text"
                id="navn"
                placeholder="Navn"
                required>

                <input
                type="date"
                id="dato"
                required>

                <input
                type="tel"
                id="telefon"
                placeholder="Telefon">

                <textarea
                id="kommentar"
                placeholder="Kommentar">
                </textarea>

                <button type="submit">
                Registrer tilgjengelighet
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Tilgjengelige ekstravakter</h2>

            <div id="vaktListe"></div>

        </section>
    </main>
<script>
    //Vaktbank
const SCRIPT_URL =
"https://script.google.com/macros/s/XXXXXXXX/exec";

document
.getElementById("vaktForm")
.addEventListener("submit", sendData);

async function sendData(e){

  e.preventDefault();

  const data = {

    navn:
      document.getElementById("navn").value,

    dato:
      document.getElementById("dato").value,

    telefon:
      document.getElementById("telefon").value,

    kommentar:
      document.getElementById("kommentar").value
  };

  await fetch(SCRIPT_URL, {

    method: "POST",

    body: JSON.stringify(data)

  });

  alert("Registrert!");

  loadVakter();
}

//Hent data fra Google Sheets
async function loadVakter(){

  const response =
    await fetch(SCRIPT_URL);

  const data =
    await response.json();

  const liste =
    document.getElementById("vaktListe");

  liste.innerHTML = "";

  data.slice(1).forEach(rad => {

    liste.innerHTML += `
      <div class="vaktKort">
        <strong>${rad[1]}</strong><br>
        📅 ${rad[2]}<br>
        📞 ${rad[3]}<br>
        💬 ${rad[4]}
      </div>
    `;
  });
}

loadVakter();

</script>
</body>
</html>
