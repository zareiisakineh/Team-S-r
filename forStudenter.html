        <h1>Stein - saks - papir</h1>
        <div id="valg">
            <button onclick="spill('stein')">👊</button>
            <button onclick="spill('saks')">✌️</button>
            <button onclick="spill('papir')">✋</button><br>
        </div>
        
        <div id="datamaskinDisplay">Datamaskin:</div>
        <div id="spillerDisplay">Spiller:</div> 
        <div id="resultat"></div>

        <div id="playerScoreDisplay">ditt poeng :
            <span id="playerScore">0</span>
        </div>

        <div id="computerScoreDisplay">datamaskinens poeng:
            <span id="computerScore">0</span>
        </div>

    </main>
    <script>
        const utvalg = ["stein", "saks", "papir"];
        const datamaskinDisplay = document.getElementById("datamaskinDisplay");
        const spillerDisplay = document.getElementById("spillerDisplay");
        const resultat = document.getElementById("resultat");
        const computerScoreDisplay = document.getElementById("computerScoreDisplay");
        const playerScoreDisplay = document.getElementById("playerScoreDisplay");
        let playerScore = 0;
        let computerScore = 0;

        function spill(spillerValg){
            const datamaskinValg = utvalg[Math.floor(Math.random()*utvalg.length)];
            console.log(datamaskinValg);
            let result = "";
           if(spillerValg === datamaskinValg){
            result = "uavgjort";
           }
           else{
            switch(spillerValg){
                case "stein":
                result = (datamaskinValg === "saks")? "du vant": "du tapte";
                break;
                case "saks":
                result = (datamaskinValg === "papir")? "du vant": "du tapte";
                break;
                case "papir":
                result = (datamaskinValg === "stein")? "du vant": "du tapte";
                break;
            }
           }
           datamaskinDisplay.textContent = `Datamaskin spilte: ${datamaskinValg}`;
           spillerDisplay.textContent = `Du spilte: ${spillerValg}`;
           resultat.textContent = result;
           //nullstiller/fjerner klassene før neste runde
           resultat.classList.remove("greenTekst", "redTekst");

           switch(result){
            case "du vant":
            resultat.classList.add("greenTekst");
            playerScore++
            playerScoreDisplay.textContent = `ditt poeng: ${playerScore}` ;
            break;
            case "du tapte":
            resultat.classList.add("redTekst");
             computerScore++;
            computerScoreDisplay.textContent = `datamaskinens poeng: ${computerScore}` ;
            break;
           }
        }

    </script>
 <script src="app.js" defer></script>
